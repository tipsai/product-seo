<!doctype html>
<!-- Cover template: real typography in HTML, the object from an image model as a transparent PNG.
     Render: node <skill folder>/scripts/shoot.mjs --html cover.html --width 1536 --height 1024 --out cover.png
     Then convert to WebP for the site. Before using it, look at it at 490 px wide (a blog feed card)
     and at 320 px wide (a phone): the headline must still read, nothing important near the edges.
     Edit: the tokens in :root from seo/brand.md (scripts/brand.mjs reads them from the site), the headline,
     the kicker, and the object image path. The defaults below are neutral grays on purpose: never ship them as is. -->
<html>
<head>
<meta charset="utf-8">
<!-- If the site's heading font is on Google Fonts, link it here, for example:
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap">
     A font that is not on Google Fonts: load it from the site with @font-face, or use the closest system font. -->
<style>
  :root {
    --bg: #F4F4F4;        /* page background of the cover: the site's background or a light tint of it */
    --bg-hi: #FFFFFF;     /* the lighter centre of the background; for a dark site, a slightly lighter dark */
    --ink: #222222;       /* headline: the site's heading colour */
    --muted: #777777;     /* kicker */
    --accent: #555555;    /* one accent only: the site's main button or link colour */
    --font: system-ui, -apple-system, "Segoe UI", sans-serif; /* the site's heading font */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1536px; height: 1024px; overflow: hidden; }
  body { font-family: var(--font); color: var(--ink);
         background: radial-gradient(1300px 900px at 70% 40%, var(--bg-hi) 0%, var(--bg) 100%); position: relative; }

  /* Safe zone: feeds crop covers differently. Keep text and the object inside it. */
  .safe { position: absolute; left: 112px; right: 112px; top: 150px; bottom: 150px;
          display: grid; grid-template-columns: 1.05fr 0.95fr; align-items: center; gap: 48px; }

  .kicker { font-size: 34px; font-weight: 600; color: var(--muted); letter-spacing: -0.3px; margin-bottom: 26px; }
  .kicker b { color: var(--accent); font-weight: 700; }
  h1 { font-size: 112px; font-weight: 800; line-height: 1.0; letter-spacing: -4px; text-wrap: balance; }

  .object { justify-self: center; width: 520px; height: 520px; display: grid; place-items: center; }
  .object img { max-width: 100%; max-height: 100%; filter: drop-shadow(0 30px 50px #0000001F); }

  /* Placeholder shown when no image is set yet: a neutral rounded card. Delete once the PNG exists. */
  .placeholder { width: 400px; height: 400px; border-radius: 96px; background: #fff; transform: rotate(-7deg);
                 box-shadow: 0 1px 2px #0000000D, 0 40px 80px #0000001F; position: relative; }
  .placeholder i { position: absolute; left: 70px; height: 26px; border-radius: 13px; background: #E8E8ED; }
  .placeholder i.a { top: 110px; width: 260px; background: var(--accent); }
  .placeholder i.b { top: 170px; width: 200px; }
  .placeholder i.c { top: 230px; width: 240px; }
  .placeholder i.d { top: 290px; width: 150px; }
</style>
</head>
<body>
  <div class="safe">
    <div>
      <div class="kicker"><b>Guide</b> · 8 min read</div>
      <h1>How to send an invoice in another currency</h1>
    </div>
    <div class="object">
      <!-- <img src="object.png" alt=""> -->
      <div class="placeholder"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
    </div>
  </div>
</body>
</html>
